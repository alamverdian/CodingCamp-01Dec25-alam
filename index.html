<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alam Corp</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="nav-brand">
          <img src="abc.svg" alt="Logo Perusahaan ABC" class="nav-logo" /> Alam Corp
        </a>
        <div class="nav-links">
          <a href="index.html" class="active">Home</a>
          <a href="#headquarter-section">Our Profile</a>
          <a href="#headquarter-section">Portofolio</a>
          <a href="#message-section">Message us</a>
        </div>
      </nav>
    </header>
    <section class="profile-banner">
      <div class="banner-overlay">
        <div class="banner-text">
          <h1>Hi <span id="outNama"></span>, Welcome To Website</h1>
          <p>ini adalah website latihan pertama</p>
        </div>
      </div> 
    </section>
    <main>
<section class="profile-content team-section" id="headquarter-section">
  <h2>Our Headquarter</h2>

  <div class="team-container">
    <div class="team-member">
      <img src="https://images.unsplash.com/photo-1617687611017-48db8d42fd8f" alt="Headquarter 1">
      <h3>Jakarta</h3>
    </div>

    <div class="team-member">
      <img src="https://images.unsplash.com/photo-1611638281871-1063d3e76e1f" alt="Headquarter 2">
      <h3>Bandung</h3>
    </div>

    <div class="team-member">
      <img src="https://images.unsplash.com/photo-1566176553949-872b2a73e04e" alt="Headquarter 3">
      <h3>Surabaya</h3>
    </div>
  </div>
</section>
      <section class="message-section" id="message-section">
  <div class="message-container">
    <div class="message-form">
      <h2>Message Us</h2>

      <form id="msgForm">
        <label>Nama</label>
        <input type="text" id="nama" required>

        <label>Tanggal Lahir</label>
        <input type="date" id="tanggalLahir" required>

        <label>Jenis Kelamin</label>
        <div class="radio-group">
          <label><input type="radio" name="jk" value="Laki-laki" required> Laki-laki</label>
          <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
        </div>

        <label>Pesan</label>
        <textarea id="pesan" rows="5" required></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
    <div class="message-output">
      <p><strong>Current Time:</strong> <span id="waktu"></span></p>
      <p><strong>Nama:</strong> <span id="outNama">-</span></p>
      <p><strong>Tanggal Lahir:</strong> <span id="outTanggal">-</span></p>
      <p><strong>Jenis Kelamin:</strong> <span id="outJK">-</span></p>
      <p><strong>Pesan:</strong> <span id="outPesan">-</span></p>
    </div>
  </div>
</section>
    </main>
    <footer class="footer">
      <p>Created By Alam</p>
    </footer>
    <script src="js/script.js"></script>
  </body>
</html>
